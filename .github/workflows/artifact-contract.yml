name: artifact contract

# Exercise the real upload/download actions without publishing a release.
# Namespace fixtures so reusable callers never confuse them with production artifacts.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare transfer fixtures and the real Pages archive
        run: |
          python3 tools/pages/build.py _site
          mkdir -p probe/pages
          tar --dereference --hard-dereference --directory _site -cf probe/pages/artifact.tar .
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('probe')
          for directory in ('apk', 'agents', 'intermediate', 'expected'):
              (root / directory).mkdir()
          # Deliberately invalid APK bytes: this is a CI transfer fixture, never a public release.
          (root / 'apk/probe.apk').write_bytes(b'PhoneBox artifact transfer fixture\n')
          for rid in ('win-x64', 'linux-x64', 'linux-arm64', 'osx-x64', 'osx-arm64'):
              with zipfile.ZipFile(root / f'agents/probe-{rid}.zip', 'w') as archive:
                  archive.writestr('payload.txt', rid)
          (root / 'intermediate/app-debug.apk').write_bytes(b'Must not enter the release directory')
          (root / 'intermediate/config.default.json').write_text('{}')
          files = [*root.glob('apk/*'), *root.glob('agents/*'), root / 'pages/artifact.tar']
          hashes = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          (root / 'expected/hashes.json').write_text(json.dumps(hashes))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-release-apk
          path: probe/apk/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-release-agent-probe
          path: probe/agents/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-intermediate
          path: probe/intermediate/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-pages
          path: probe/pages/artifact.tar
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-expected
          path: probe/expected/hashes.json
          if-no-files-found: error
          retention-days: 1

  download:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: contract-release-*
          merge-multiple: true
          path: received/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contract-pages
          path: received/pages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contract-expected
          path: received/expected
      - name: Verify exact release contents, hashes and Pages tar format
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, tarfile, zipfile
          root = pathlib.Path('received')
          expected = json.loads((root / 'expected/hashes.json').read_text())
          files = list((root / 'release').iterdir())
          assert {p.name for p in files} == set(expected) - {'artifact.tar'}, files
          assert len(files) == 6
          for path in [*files, root / 'pages/artifact.tar']:
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected[path.name], path
          for path in (root / 'release').glob('*.zip'):
              with zipfile.ZipFile(path) as archive:
                  assert archive.namelist() == ['payload.txt']
                  assert archive.read('payload.txt').decode() == path.stem.removeprefix('probe-')
          with tarfile.open(root / 'pages/artifact.tar') as archive:
              names = {m.name.removeprefix('./') for m in archive.getmembers()}
              assert {'index.html', 'panel/index.html', 'panel/widgets/stack.js'} <= names
              assert not any(m.issym() or m.islnk() for m in archive.getmembers())
          print('PASS: 6 release files, intermediate exclusion, byte-for-byte transfer and Pages archive')
          PY
